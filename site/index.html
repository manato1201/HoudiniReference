<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoudiniReference</title>
<meta name="description" content="Houdini の Tips・ニュース・リファレンスを公式フィード/API から集めて確認する個人用サイト。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2410c'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%23fff'/%3E%3Ccircle cx='23' cy='9' r='3' fill='%23fff'/%3E%3Ccircle cx='23' cy='23' r='3' fill='%23fff'/%3E%3Cpath d='M9 16 23 9M9 16 23 23' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#list">本文へ</a>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 28" aria-hidden="true" focusable="false">
        <path d="M8 14 32 5M8 14 32 23" stroke="currentColor" stroke-width="2" fill="none"/>
        <circle cx="8" cy="14" r="5" fill="currentColor"/><circle cx="32" cy="5" r="4" fill="currentColor"/><circle cx="32" cy="23" r="4" fill="currentColor"/>
      </svg>
      <div>
        <h1>HoudiniReference</h1>
        <p class="tagline">Tips・ニュース・リファレンスを集めて、見に行く場所</p>
      </div>
    </div>
    <div class="top-tools">
      <span id="updated" class="chip mono" title="データの最終更新">最終更新 …</span>
      <button id="theme" class="btn" type="button" aria-label="表示テーマを切り替え">テーマ</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="stale" class="notice" hidden></div>

  <div class="tabs" role="tablist" aria-label="分類">
    <button role="tab" id="tab-news" data-tab="news" aria-controls="list" aria-selected="false">ニュース <span class="count" data-count="news"></span></button>
    <button role="tab" id="tab-tips" data-tab="tips" aria-controls="list" aria-selected="false">Tips <span class="count" data-count="tips"></span></button>
    <button role="tab" id="tab-reference" data-tab="reference" aria-controls="list" aria-selected="false">リファレンス <span class="count" data-count="reference"></span></button>
  </div>

  <form class="toolbar" id="filters" role="search" onsubmit="return false">
    <label class="field grow"><span class="lbl">検索</span>
      <input id="q" type="search" placeholder="題名・抜粋・タグ(スペースで AND)" autocomplete="off"></label>
    <div class="field"><span class="lbl" id="kind-lbl">種別</span>
      <div class="seg" role="group" aria-labelledby="kind-lbl" id="kind">
        <button type="button" data-kind="" aria-pressed="true">すべて</button>
        <button type="button" data-kind="rss" aria-pressed="false">Web</button>
        <button type="button" data-kind="youtube" aria-pressed="false">YouTube</button>
        <button type="button" data-kind="github" aria-pressed="false">GitHub</button>
        <button type="button" data-kind="x" aria-pressed="false">X</button>
      </div></div>
    <div class="field"><span class="lbl" id="lang-lbl">言語</span>
      <div class="seg" role="group" aria-labelledby="lang-lbl" id="lang">
        <button type="button" data-lang="" aria-pressed="true">すべて</button>
        <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div></div>
    <label class="field"><span class="lbl">出典</span><select id="source"><option value="">すべて</option></select></label>
    <label class="field"><span class="lbl">期間</span>
      <select id="period"><option value="0">全期間</option><option value="7">7 日</option><option value="30">30 日</option><option value="90">90 日</option></select></label>
    <div class="field"><span class="lbl">&nbsp;</span><button id="favonly" class="btn" type="button" aria-pressed="false">☆ お気に入りのみ</button></div>
  </form>

  <section id="refs" class="refs" aria-label="公式ドキュメントの入口" hidden></section>

  <p id="status" class="status" role="status" aria-live="polite"></p>
  <ol id="list" class="list" tabindex="-1"></ol>
  <div id="empty" class="empty" hidden></div>
</main>

<footer class="wrap foot">
  <nav class="related" aria-labelledby="related-h">
    <h2 id="related-h" class="related-h">関連サイト</h2>
    <ul id="related-list" class="related-list"></ul>
    <p class="fine">お気に入り・テーマ・設定はサイトごとに別々に保存され、共有されません。</p>
  </nav>
  <details id="health"><summary>情報源の状態</summary><ul id="health-list"></ul></details>
  <p class="fine">収集は公式のフィード/API の範囲だけ。保存するのは題名・URL・出典名・日付・短い抜粋・タグで、全文は保存しません。各項目の出典名と元ページのリンクから元の内容を確認してください。X の投稿は削除・変更されることがあります。</p>
</footer>
<script src="app.js"></script>
</body>
</html>
